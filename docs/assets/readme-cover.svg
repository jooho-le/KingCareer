<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">경험으로 넓히는 나의 진로</title>
  <desc id="desc">주황, 보라, 파랑 물결을 담은 전북 진로경험 격차 해소 AI 플랫폼 소개 이미지</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F4"/>
      <stop offset="0.48" stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#F1F7FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="orangeWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A24" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFB264" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="purpleWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A56AF4" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#8154E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6F63E7" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="blueWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#559BFA" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#347FE9" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#1472E6" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6C63B5" flood-opacity="0.12"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="18" y="18" width="1164" height="424" rx="30"/>
    </clipPath>
  </defs>

  <rect x="18" y="18" width="1164" height="424" rx="30" fill="url(#background)" filter="url(#shadow)"/>
  <g clip-path="url(#cardClip)">
    <circle cx="1088" cy="24" r="178" fill="#8B5CF6" opacity="0.09" filter="url(#blur)"/>
    <circle cx="956" cy="396" r="172" fill="#2F80ED" opacity="0.10" filter="url(#blur)"/>
    <circle cx="128" cy="416" r="150" fill="#FF8A24" opacity="0.10" filter="url(#blur)"/>

    <path d="M-50 380 C125 299 244 344 388 398 C542 456 665 442 788 369 C924 288 1047 281 1250 366 L1250 500 L-50 500 Z" fill="url(#orangeWave)" opacity="0.78"/>
    <path d="M-60 432 C116 331 272 323 424 380 C598 445 712 423 847 334 C981 246 1110 269 1260 333 L1260 500 L-60 500 Z" fill="url(#purpleWave)" opacity="0.82"/>
    <path d="M-80 474 C97 390 254 361 431 402 C619 446 733 411 887 326 C1027 249 1146 268 1280 314 L1280 500 L-80 500 Z" fill="url(#blueWave)" opacity="0.88"/>

    <path d="M824 83 C900 38 987 49 1047 102 C1101 149 1122 204 1204 212" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.42"/>
    <circle cx="824" cy="83" r="5" fill="#FF7A1A"/>
    <circle cx="1047" cy="102" r="5" fill="#8B5CF6"/>
    <circle cx="1176" cy="207" r="5" fill="#2F80ED"/>
  </g>

  <g font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif">
    <text x="76" y="87" fill="#5F6072" font-size="17" font-weight="600" letter-spacing="1.2">전북 진로경험 격차 해소 AI 플랫폼</text>
    <rect x="76" y="111" width="154" height="5" rx="2.5" fill="url(#line)"/>
    <text x="72" y="190" fill="#202136" font-size="52" font-weight="800" letter-spacing="-1.5">경험으로 넓히는</text>
    <text x="72" y="254" fill="#202136" font-size="52" font-weight="800" letter-spacing="-1.5">나의 진로</text>
    <text x="76" y="301" fill="#646579" font-size="19">아직 만나지 못한 일을 경험하고, 나만의 선택을 시작합니다.</text>
  </g>
</svg>
