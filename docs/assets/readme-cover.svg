<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">KingCareer</title>
  <desc id="description">나의 다음 경험을 발견하다. 선명한 주황, 보라, 파랑의 단색 도형과 KingCareer 타이포그래피.</desc>
  <defs><clipPath id="frame"><rect width="1200" height="420" rx="32"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#F6F5F1"/>
    <rect x="828" y="-46" width="336" height="282" rx="70" fill="#7C3AED" transform="rotate(12 996 95)"/>
    <rect x="990" y="176" width="330" height="332" rx="76" fill="#0967FF" transform="rotate(-12 1155 342)"/>
    <rect x="754" y="208" width="222" height="250" rx="52" fill="#FF6A1F" transform="rotate(-9 865 333)"/>
    <g font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif">
      <text x="64" y="86" font-size="18" font-weight="700" letter-spacing="2" fill="#0967FF">YOUR NEXT EXPERIENCE</text>
      <text x="60" y="201" font-size="103" font-weight="800" letter-spacing="-5" fill="#182039">KingCareer</text>
      <text x="65" y="278" font-size="33" font-weight="700" letter-spacing="-1" fill="#182039">나의 다음 경험을 발견하다.</text>
      <text x="67" y="333" font-size="19" fill="#4F566C">전북 학생의 진로 탐험, 작은 경험부터.</text>
    </g>
  </g>
</svg>
